---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - network.ppnb.io
  resources:
  - nodenetworks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - network.ppnb.io
  resources:
  - nodenetworks/finalizers
  verbs:
  - update
- apiGroups:
  - network.ppnb.io
  resources:
  - nodenetworks/status
  verbs:
  - get
  - patch
  - update
